services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stv-backend
    ports:
      - "4000:4000"
    volumes:
      - ./portalb2b.db:/app/portalb2b.db
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - PORT=4000
      - CORS_ORIGIN=http://localhost:80
      - COOKIE_SECRET=stv_cookie_secret_2026
      - DATABASE_PATH=/app/portalb2b.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: stv-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
