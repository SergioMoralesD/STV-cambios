services:
  stv-portal:
    build: .
    container_name: stv-portal
    ports:
      - "4000:4000"
    volumes:
      - portal-data:/app/data
    environment:
      - PORT=4000
      - CORS_ORIGIN=http://localhost:4000
      - COOKIE_SECRET=stv_local_secret
    restart: unless-stopped

volumes:
  portal-data:
